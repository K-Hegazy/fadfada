<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>فضفضة - شات فضفضة ودردشة عربية فورية</title>
    <script>
      (function () {
        var basePath = "/";
        var l = window.location;
        var normalizedBase = basePath.endsWith("/") ? basePath : basePath + "/";
        var rest =
          l.pathname.indexOf(normalizedBase) === 0
            ? l.pathname.slice(normalizedBase.length)
            : l.pathname.replace(/^\/+/, "");
        var query = l.search
          ? "&" + l.search.slice(1).replace(/&/g, "~and~")
          : "";
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            normalizedBase +
            "?/" +
            rest.replace(/&/g, "~and~") +
            query +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
